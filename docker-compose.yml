version: '3.8'

services:
  # FastAPI Backend Service
  # Uses SQLite (file-backed, persisted via the ./data volume) and your
  # configured Qdrant Cloud instance -- both already set up in .env -- so
  # there's no separate local Postgres/Qdrant container to keep in sync.
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: multiagent_rag_backend
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - FRONTEND_ORIGIN=http://localhost:3000
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - hf_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 45s
    restart: unless-stopped

  # React Frontend Service
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: multiagent_rag_frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  hf_cache:
